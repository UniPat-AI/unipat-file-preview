name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag (如 latest, beta)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Publish to GitHub Packages
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        run: |
          which node || export PATH=$HOME/.nvm/versions/node/v24.15.0/bin:$PATH
          which pnpm || npm install -g pnpm
          echo "Node version: $(node -v)"
          echo "pnpm version: $(pnpm -v)"

      - name: Install dependencies
        run: pnpm install

      - name: Run build
        run: pnpm --filter @unipat-ai/file-preview run build

      - name: Run tests
        run: pnpm --filter @unipat-ai/file-preview run test

      - name: Publish to GitHub Packages
        run: |
          cd packages/react
          echo "@unipat-ai:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc
          pnpm publish --tag ${{ github.event.inputs.tag || 'latest' }} --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
